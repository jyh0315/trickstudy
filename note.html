<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노트 · 트릭스터디</title>

<style>
:root {
  --ink: #3b2a20; --ink-soft: #7a6253; --cream: #fff8e6; --cream-2: #fdecc8; --paper: #fffdf6;
  --yellow: #ffd34e; --pink: #ff8fb1; --pink-d: #e0577f; --mint: #7fd6c2; --sky: #8fd3ff; --red: #ff7b6e; --purple: #b77cff;
  --line: 3px solid var(--ink); --shadow: 0 4px 0 var(--ink); --radius: 18px;
  --font-title: "Jua", "Gowun Dodum", system-ui, sans-serif; --font-body: "Gowun Dodum", "Jua", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font: 15px/1.45 var(--font-body); padding: 12px 16px 40px; }
h1 { font: 22px var(--font-title); margin: 0; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.top img { width: 46px; height: 46px; border: var(--line); border-radius: 14px; background: var(--paper); }
.top a { margin-left: auto; color: var(--ink-soft); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 13px var(--font-title); padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
.chip.ok { background: var(--mint); } .chip.no { background: var(--red); color: #fff; } .chip.wait { background: var(--cream-2); }
.say { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 10px; }
.say p { margin: 0; padding: 8px 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; font-size: 14px; flex: 1; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { font: 14px var(--font-title); border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--yellow); }
.btn { font: 14px var(--font-title); border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 6px 12px; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); }
.btn.yellow { background: var(--yellow); }
label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
select { font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 6px; background: var(--paper); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.paper { position: relative; border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; height: 70vh; background: #e9dcc4; overscroll-behavior: contain; padding: 14px 0; }
#board { display: block; margin: 0 auto; touch-action: none; cursor: crosshair; background: #fff; box-shadow: 0 2px 10px rgba(59, 42, 32, .25); }
.nbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.nbar .ntitle { flex: 2; min-width: 180px; font: 18px var(--font-title); border: 2px solid var(--ink); border-radius: 12px; padding: 5px 10px; background: var(--paper); color: var(--ink); }
.nbar .psum { flex: 3; min-width: 200px; display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 12px; padding: 2px 4px 2px 10px; background: var(--paper); }
.nbar .psum b { font: 13px var(--font-title); white-space: nowrap; }
.nbar .psum input { flex: 1; border: 0; outline: none; font: 14px var(--font-body); background: transparent; padding: 4px; color: var(--ink); }
.aiStat { font: 12.5px var(--font-title); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; background: var(--paper); color: var(--ink); cursor: pointer; max-width: 330px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aiStat.ok { background: var(--mint); } .aiStat.work { background: #ffe08a; } .aiStat.bad { background: var(--red); color: #fff; } .aiStat.off { background: #e9e2d6; }
.zoom { display: inline-flex; align-items: center; gap: 4px; font: 13px var(--font-title); }
.zoom .btn { padding: 3px 8px; }
#zNum { min-width: 42px; text-align: center; }
.pageBg { fill: #fff; }
.ruled { stroke: #f0dcb4; stroke-width: 1; }
.gridL { stroke: #eef0f4; stroke-width: 1; }
.marginL { stroke: #ffc2c2; stroke-width: 1.2; }
/* PDF (인쇄) */
#print { display: none; }
/* ⛶ 집중 모드: 노트만 */
body.zen { padding: 0 !important; overflow: hidden; }
body.zen .nbar, body.zen #settings, body.zen .tb, body.zen .side { display: none !important; }
body.zen .wrap { display: block; }
body.zen .paper { height: 100vh !important; border: 0; border-radius: 0; box-shadow: none; }
.zen { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 3px; padding: 5px 7px; background: rgba(255, 248, 230, .96); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); touch-action: none; }
.zen[hidden] { display: none; }
.zen button { font: 15px var(--font-title); min-width: 36px; height: 34px; border: 2px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; color: var(--ink); padding: 0 6px; }
.zen button.on { background: var(--yellow); border-color: var(--ink); }
.zen .zx { background: var(--pink); border-color: var(--ink); }
.zen .zsep { width: 2px; height: 22px; background: var(--ink-soft); opacity: .4; margin: 0 3px; }
.zen .zpg[hidden] { display: none; }
.cvp { position: fixed; inset: 0; z-index: 50; background: rgba(40, 28, 20, .55); display: grid; place-items: center; padding: 16px; }
.cvp-box { background: var(--cream); border: var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px; max-width: 720px; width: 100%; }
.cvp-box h3 { margin: 0 0 10px; font: 20px var(--font-title); }
.cvp-row { display: flex; gap: 14px; flex-wrap: wrap; }
.cvp-stage { position: relative; width: 300px; height: 385px; flex: none; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: #fffdf6 radial-gradient(circle at 50% 35%, #fff 0, #ffe9b8 70%); }
.cvp-stage.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: cvpFlash .45s ease-out forwards; }
@keyframes cvpFlash { from { opacity: .95; } to { opacity: 0; } }
.cvp-host { position: absolute; inset: 0; }
.cvp-msg { position: absolute; inset: 0; display: grid; place-items: center; font: 15px var(--font-title); color: var(--ink-soft); }
.cvp-side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
.cvp-moods { display: flex; flex-wrap: wrap; gap: 6px; }
.cvp-moods .btn { padding: 5px 10px; font-size: 14px; }
.cvp-moods .btn.on { background: var(--yellow); }
.cvp-moods small { opacity: .6; font-size: 11px; }
.cvp-shot { font-size: 18px !important; padding: 10px !important; }
.cvp-prev { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.cvp-prev img { width: 78px; height: 100px; object-fit: contain; border: 2px dashed var(--ink-soft); border-radius: 10px; background: #fff; }
.cvp-prev img:not([src]) { visibility: hidden; }
.stk-box { max-width: 760px; }
.shp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 2px; }
.shp-it { border: 2px solid var(--ink); border-radius: 12px; background: repeating-linear-gradient(#fffdf6 0 13px, #f3e3c0 13px 14px); padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 12.5px var(--font-title); color: var(--ink); }
.shp-it:hover { background: var(--cream-2); }
.shp-pv { width: 88px; height: 56px; display: grid; place-items: center; }
.shp-pv svg { max-width: 88px; max-height: 56px; }
.stk-box h3 { display: flex; align-items: center; gap: 10px; }
.stk-box h3 input { flex: 1; max-width: 220px; font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px; }
.stk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; max-height: 56vh; overflow-y: auto; padding: 2px; }
.stk-it { border: 2px solid var(--ink); border-radius: 12px; background: #fff; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 12px var(--font-title); color: var(--ink); }
.stk-it img { width: 64px; height: 64px; object-fit: contain; }
.stk-it span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.stk-it.no { opacity: .55; }
.stk-it:hover, .stk-op:hover { background: var(--cream-2); }
.stk-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-family: var(--font-title); }
.stk-opts { display: flex; flex-wrap: wrap; gap: 10px; }
.stk-op { width: 120px; border: 2px solid var(--ink); border-radius: 14px; background: #fff; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 13px var(--font-title); color: var(--ink); }
.stk-op img { width: 104px; height: 104px; object-fit: contain; }
.stk-op.live { background: linear-gradient(#fff, #ffe9b8); justify-content: center; }
.stk-cam { font-size: 44px; height: 104px; display: grid; place-items: center; }
.selBar { position: absolute; z-index: 4; display: flex; gap: 4px; padding: 4px; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.selBar[hidden] { display: none; }
.selBar button { font: 15px var(--font-title); width: 34px; height: 30px; border: 2px solid var(--ink); border-radius: 9px; background: #fff; cursor: pointer; color: var(--ink); }
.selBar button[data-a="del"] { background: #ffe1dc; }
.selBar button[data-a="redraw"] { background: #efe4ff; }
.selBar button[data-a="okuns"] { background: #fff3a6; }
.aiio { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.aiio h4 { margin: 0 0 6px; font: 15px var(--font-title); }
.aiio textarea { width: 100%; height: 230px; box-sizing: border-box; font: 13px/1.5 var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 8px; background: #fff; resize: vertical; }
.aiRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font: 13px var(--font-title); }
.aiRow .btn:last-child { margin-left: auto; }
@media (max-width: 640px) { .aiio { grid-template-columns: 1fr; } .aiio textarea { height: 150px; } }
.inEdit { position: absolute; z-index: 6; font-family: var(--font-body); line-height: 1.6; padding: 6px 8px; border: 2.5px solid var(--pink-d); border-radius: 10px; background: #fffdf6; box-shadow: 0 4px 0 var(--ink); resize: both; outline: none; color: var(--ink); }
.selBar button[hidden] { display: none; }
.selBar button.wide { width: auto; min-width: 34px; padding: 0 6px; }
.selBar button.busy { animation: sbBusy 1s linear infinite; }
@keyframes sbBusy { 50% { opacity: .35; } }
.labT { font-family: var(--font-body); white-space: nowrap; line-height: 1.1; width: max-content; }
.labT .katex { font-size: 1em; }
.cvp-skin { display: flex; align-items: center; gap: 6px; font: 14px var(--font-title); }
.cvp-skin[hidden] { display: none; }
.cvp-skin select { font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 6px; background: #fff; }
.cvp-ctl { display: flex; align-items: center; gap: 8px; }
.cvp-ctl input { flex: 1; accent-color: var(--pink-d); }
.cvp-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  #print, #print * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; } /* 표지 색·배경이 인쇄에서 빠지지 않게 */
  .pp { width: 210mm; height: 297mm; overflow: hidden; page-break-after: always; break-after: page; position: relative; }
  .pp:last-child { page-break-after: auto; break-after: auto; }
  .pp svg, .pg svg { width: 210mm; height: 297mm; display: block; }
  .pp2 { width: 297mm; height: 210mm; overflow: hidden; display: flex; page-break-after: always; break-after: page; }
  .pp2:last-child { page-break-after: auto; break-after: auto; }
  .pp2 .half { width: 148.5mm; height: 210mm; overflow: hidden; position: relative; background: #fff; }
  .pp2 .half > .pg { width: 210mm; height: 297mm; transform: scale(.70711); transform-origin: 0 0; }
}
.pdfopt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pdfopt button { text-align: left; padding: 12px !important; font-size: 15px !important; line-height: 1.4; }
.pdfopt button small { display: block; font: 12px var(--font-body); color: var(--ink-soft); margin-top: 4px; }
.cvsw { display: flex; flex-wrap: wrap; gap: 8px; }
.cvbg { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-height: 170px; overflow: auto; padding: 4px; border: 2px dashed var(--ink-soft); border-radius: 12px; background: #fff; }
.cvbg button { aspect-ratio: 16 / 10; border: 2px solid var(--ink); border-radius: 8px; padding: 0; overflow: hidden; cursor: pointer; background: #fff8e6; font: 12px var(--font-title); color: var(--ink); }
.cvbg button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cvbg button.on { outline: 3px solid var(--pink-d); outline-offset: 1px; }
.cvsw button { width: 74px; height: 50px; border: 2px solid var(--ink); border-radius: 12px; cursor: pointer; font: 12px var(--font-title); display: grid; place-items: end center; padding-bottom: 4px; }
.cvsw button.on { outline: 3px solid var(--pink-d); outline-offset: 2px; }
@media (max-width: 520px) { .pdfopt { grid-template-columns: 1fr; } }
.cover { width: 210mm; height: 297mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10mm; background: linear-gradient(#fff8e6, #fdecc8); font-family: var(--font-title); color: var(--ink); text-align: center; }
.cover .cv-frame { width: 120mm; height: 150mm; border: 2mm solid var(--ink); border-radius: 12mm; background: #fffdf6 radial-gradient(circle at 50% 35%, #fff 0, #ffe9b8 70%); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.cover .cv-frame { position: relative; }
.cover .cv-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cover .cv-frame img.cv-bg { object-fit: cover; }
.cover h1 { font-size: 15mm; margin: 0; line-height: 1.2; max-width: 180mm; }
.cover .cv-sub { font: 6mm var(--font-body); color: var(--ink-soft); }
.cover .cv-badge { color: var(--ink); font-size: 5mm; padding: 2mm 6mm; border: 1mm solid var(--ink); border-radius: 99mm; background: var(--yellow); }
.tb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 4px 0; }
.tb .seg button { padding: 4px 7px; font-size: 13px; }
.tb .btn { padding: 4px 7px; font-size: 13px; }
.tb { gap: 5px; }
.tbR { margin-left: auto; display: inline-flex; gap: 6px; }
.btn.mint { background: var(--mint); } .btn.sky { background: var(--sky); }
.btn.off { opacity: .55; }
.pnav { display: inline-flex; align-items: center; gap: 6px; font: 14px var(--font-title); }
.pnav[hidden] { display: none; }
body.focus #settings { display: none; }
body.focus { padding-top: 6px; }
body.noside .wrap { grid-template-columns: 1fr; }
body.noside .side { display: none; }
.side { max-height: 80vh; overflow-y: auto; }
.pageLine { stroke: #c9a46a; stroke-width: 1.5; stroke-dasharray: 10 8; }
.pageNo { font: 12px var(--font-title); fill: #b08d5a; }
.head { font: 24px var(--font-title); fill: #2f5fb0; }
.headBg { fill: #fff1a8; }
#board * { pointer-events: none; } /* 펜 입력은 항상 판 전체가 받음 (상자를 다시 그려도 끊기지 않게) */
#board.move, #board.hand { cursor: grab; }
#board.placing { cursor: copy; } #board.erase { cursor: cell; }
.stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.box { fill: none; stroke-width: 2; stroke-dasharray: 6 5; rx: 10; }
.box.text { stroke: #4aa3df; fill: rgba(143, 211, 255, .08); } .box.draw { stroke: #e0577f; fill: rgba(255, 143, 177, .08); }
.box.label { stroke-dasharray: 2 4; }
.setBox { fill: rgba(183, 124, 255, .06); stroke: #b77cff; stroke-width: 2.5; stroke-dasharray: 10 6; }
.hlStroke { stroke-opacity: .38; stroke-linecap: round; }
.grip { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.grip.on { fill: var(--pink); }
.gripMark { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; fill: none; }
.box.sel { stroke-dasharray: none; stroke-width: 3; }
.tag { font: 12px var(--font-title); }
.clean { font-family: var(--font-body); fill: var(--ink); }
.cleanF { display: inline-block; font-family: var(--font-body); color: var(--ink); white-space: nowrap; overflow: visible; }
.cleanF .katex { font-size: 1em; }
.cleanB { display: inline-block; font-family: var(--font-body); color: var(--ink); line-height: 1.55; white-space: nowrap; }
.cleanB > div { white-space: nowrap; width: max-content; }
.cleanB.typed { display: block; white-space: normal; }
.cleanB.typed > div { white-space: pre-wrap; width: auto; overflow-wrap: anywhere; min-height: 1em; }
.cleanB .katex { font-size: 1.05em; }
/* 나무 모양 가지선 */
.cleanB .tc { display: inline-block; width: 1.5em; height: 40px; vertical-align: top; position: relative; }
.cleanB .tc.v::before, .cleanB .tc.t::before, .cleanB .tc.l::before { content: ""; position: absolute; left: .55em; top: 0; border-left: 2px solid currentColor; opacity: .75; }
.cleanB .tc.v::before, .cleanB .tc.t::before { bottom: 0; }
.cleanB .tc.l::before { height: 50%; }
.cleanB .tc.t::after, .cleanB .tc.l::after { content: ""; position: absolute; left: .55em; right: .15em; top: 50%; border-top: 2px solid currentColor; opacity: .75; }
.card .txt .katex { font-size: 1.05em; }
.ai { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 12px; margin-bottom: 10px; }
.ai summary { cursor: pointer; font: 15px var(--font-title); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aiIn { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.aiIn input[type=password] { flex: 1; min-width: 200px; font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; }
.ai .meta { margin: 4px 0; }
mark.uns { background: #ffe08a; border-bottom: 2px dotted #d8483b; color: inherit; border-radius: 3px; }
.chk { font-size: 12px; margin-top: 4px; padding: 4px 6px; border-radius: 8px; background: #eaf6ff; border: 1.5px dashed #2f7fd0; }
.side { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; }
.card h3 { margin: 0 0 4px; font: 15px var(--font-title); display: flex; align-items: center; gap: 6px; }
.card .k { font: 12px var(--font-title); padding: 1px 8px; border-radius: 999px; border: 2px solid var(--ink); cursor: pointer; }
.card .k.text { background: var(--sky); } .card .k.draw { background: var(--pink); }
.card .txt { white-space: pre-wrap; font-size: 16px; min-height: 1.4em; outline: none; border-radius: 8px; padding: 2px 4px; }
.card .txt:focus { background: var(--cream-2); }
.alts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.alts button { font: 12px var(--font-body); border: 1.5px solid var(--ink-soft); background: #fff; border-radius: 8px; padding: 1px 6px; cursor: pointer; }
.meta { font-size: 11px; color: var(--ink-soft); }
.card.sel { background: var(--cream-2); }
.empty { color: var(--ink-soft); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 12px; font: 14px var(--font-title); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="nbar">

<script>
"use strict";
/* ───────── 상태 ───────── */
const $ = (id) => document.getElementById(id) || document.createElement("i"); // (없는 칸은 빈 요소로 — 옛 테스트 화면과 코드 공유)
const svg = $("board"), NS = "http://www.w3.org/2000/svg";
const PAGE_W = 794, PAGE_H = 1123; // A4 (96dpi 기준 210×297mm)
const NOTE_ID = new URLSearchParams(location.search).get("id");
let note = null, Z = 1, zFit = true; // 지금 노트 기록 · 확대 배율
let strokes = [], meta = {}, nextId = 1, tool = "pen", view = "both", color = "#3b2a20", sel = null;
let blocks = [];
let heads = [], mode = "inf", page = 0, pageH = PAGE_H, focusUI = true, sideOn = false, noteTitle = ""; // 노트 모드·제목

/* 노트 저장: 브라우저 저장소(IndexedDB) "trickstudy-notes" 에 노트마다 따로 */
let saveT = 0;
function save() {
  clearTimeout(saveT); $("saveState").textContent = "저장 중…";
  const wait = strokes.length > 6000 ? 2500 : strokes.length > 2500 ? 1500 : 600; // 긴 노트는 모아서
  saveT = setTimeout(() => { if (activePointer != null) return save(); saveNow(); }, wait); // 쓰는 중이면 펜을 뗀 뒤에
}
let lockedOut = false;
let boxesOn = true; // 글/그림 영역 표시 // 다른 탭이 이 노트를 가져가면 이 탭은 저장하지 않음
async function saveNow() {
  saveT = 0;
  if (!note || lockedOut) return;
  Object.assign(note, {
    title: $("title").value.trim() || "제목 없는 노트", paper: $("paperSel").value, bg: $("bgSel").value, coverBg: note.coverBg || 0, coverImg: note.coverImg || "",
    data: { strokes, meta, nextId, heads }, mode, page, zoom: zFit ? 0 : Z, view, focusUI, sideOn, boxes: boxesOn,
    check: $("gCheck").checked, auto: $("gAuto").checked, drawTidy: $("gDraw").value, hold: $("gHold").checked, labRead: $("gLab").checked, updated: Date.now(), scroll: Math.round(paper.scrollTop),
    stats: { pages: pageCount(), blocks: blocks.length, imgs: strokes.filter((st) => st.img).length },
  });
  try { await notePut(note); $("saveState").textContent = "저장됨 ✓"; } catch (e) { $("saveState").textContent = "⚠️ 저장 실패"; toast("저장하지 못했어요: " + (e.message || e)); }
}
addEventListener("pagehide", () => { if (saveT) { clearTimeout(saveT); saveNow(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && saveT) { clearTimeout(saveT); saveNow(); } });
// 같은 노트를 다른 탭에서도 열었을 때 안내 창
function tabBlock(html, buttons) {
  let ov = document.getElementById("tabBlock");
  if (!ov) { ov = document.createElement("div"); ov.id = "tabBlock"; ov.className = "cvp"; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="cvp-box" style="max-width:440px;text-align:center"><h3>📒 ${html}</h3><div class="cvp-foot" style="justify-content:center">${buttons}</div></div>`;
  return ov;
}
async function onLost() { // 다른 탭이 "여기서 쓸게" 했을 때
  clearTimeout(saveT); await saveNow(); lockedOut = true;
  const ov = tabBlock("다른 탭에서 이 노트를 이어서 쓰고 있어요.<br><small style='font-family:var(--font-body)'>여기서 쓴 건 저장해 뒀어요. 이 탭은 쉬는 중이에요.</small>",
    '<a class="btn" href="./#note">노트 목록</a><button class="btn mint" id="tbBack">이 탭에서 다시 쓰기</button>');
  ov.querySelector("#tbBack").onclick = async () => { if (await NoteStore.lock.takeover(note.id, onLost)) location.reload(); };
}
async function loadNote() {
  if (NOTE_ID && !(await NoteStore.lock.open(NOTE_ID, onLost))) { // 다른 탭이 쓰는 중
    await new Promise((resolve) => {
      const ov = tabBlock("이 노트가 다른 탭에서 열려 있어요.<br><small style='font-family:var(--font-body)'>두 곳에서 같이 쓰면 한쪽 필기가 사라질 수 있어서 한 곳에서만 쓸 수 있어요.</small>",
        '<a class="btn" href="./#note">노트 목록</a><button class="btn mint" id="tbHere">여기서 쓰기</button>');
      ov.querySelector("#tbHere").onclick = async () => { ov.querySelector("#tbHere").textContent = "넘겨받는 중…"; if (await NoteStore.lock.takeover(NOTE_ID, onLost)) { ov.remove(); resolve(); } else toast("넘겨받지 못했어요. 다른 탭을 닫고 다시 눌러 주세요"); };
    });
  }
  let n = NOTE_ID ? await noteGet(NOTE_ID) : null;
  if (!n) { // 주소에 노트가 없으면 새 노트
    n = { id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: "새 노트", paper: "lined", created: Date.now(), updated: Date.now(), pages: [] };
    history.replaceState(null, "", "?id=" + n.id);
    await NoteStore.lock.open(n.id, onLost);
  }
  note = n; note.pages = note.pages || [];
  const d = n.data || {};
  strokes = d.strokes || []; meta = d.meta || {}; nextId = d.nextId || 1; heads = d.heads || [];
  mode = n.mode || "inf"; page = n.page || 0; view = n.view || "both";
  focusUI = n.focusUI !== false; sideOn = !!n.sideOn; boxesOn = n.boxes !== false;
  if (n.zoom) { Z = n.zoom; zFit = false; }
  $("title").value = n.title || ""; $("paperSel").value = n.paper || "lined"; $("bgSel").value = n.bg || "#ffffff"; if (!$("bgSel").value) $("bgSel").value = "#ffffff";
  $("gCheck").checked = !!n.check; $("gAuto").checked = n.auto !== false; $("gDraw").value = ["smooth", "strong"].includes(n.drawTidy) ? n.drawTidy : "off"; $("gHold").checked = n.hold !== false; $("gLab").checked = n.labRead !== false;
  document.title = (n.title || "노트") + " · 트릭스터디";
}
/* 되돌리기: 가장 잦은 "획 하나 쓰기"는 노트 전체를 복사하지 않고 그 획 번호 + 덩어리 정보만 기억.
   옮기기·지우기·배치처럼 여러 획이 바뀌는 건 통째로 기억하되, 기록 전체가 25MB 를 넘으면 오래된 것부터 버림 */
let undoBytes = 0;
function pushUndo(entry) {
  entry.size = (entry.full || "").length + (entry.meta || "").length;
  undoStack.push(entry); undoBytes += entry.size; redoStack.length = 0; // 새로 한 일이 생기면 '다시 하기'는 사라짐
  while (undoStack.length > 80 || (undoBytes > 25e6 && undoStack.length > 1)) undoBytes -= undoStack.shift().size;
}
function snapshot() { pushUndo({ full: JSON.stringify({ strokes, meta, heads }) }); }
function snapshotAdd(firstId) { pushUndo({ addFrom: firstId, meta: JSON.stringify({ meta, heads }) }); }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function say(t) { $("say").textContent = t; if (focusUI) toast(t); }

/* ───────── 손글씨 인식 API 확인 ───────── */
async function query(lang) {
  const n = navigator;
  try {
    if (n.queryHandwritingRecognizer) return await n.queryHandwritingRecognizer({ languages: [lang] });
    if (n.queryHandwritingRecognizerSupport) { const r = await n.queryHandwritingRecognizerSupport({ languages: [lang] }); return r && r.languages ? r : null; }
  } catch (e) { return null; }
  return null;
}
async function checkApi() {
  if (!("createHandwritingRecognizer" in navigator)) env.api = "none";
  else { env.api = "yes"; env.ko = await query("ko"); env.en = await query("en"); }
  // (Gemini 키가 없을 때만 쓰는 예비 인식기라 따로 표시하지 않음)
  if (!gem.key) say("⚙️ 설정의 🔑 AI 인식에 Gemini 키를 넣으면 한국어·수식까지 읽어요.");
}
async function getRecognizer() {
  const lang = env.ko ? "ko" : "en"; // 키가 없을 때만 쓰는 크롬 내장 인식
  if (recognizer && recLang === lang) return recognizer;
  if (env.api !== "yes") return null;
  try { if (recognizer && recognizer.finish) recognizer.finish(); } catch (e) { /* 무시 */ }
  try { recognizer = await navigator.createHandwritingRecognizer({ languages: [lang] }); recLang = lang; }
  catch (e) { recognizer = null; recLang = null; toast("인식기를 못 만들었어요: " + (e.message || e.name)); }
  return recognizer;
}

/* ───────── 그리기 ───────── */
const offY = () => (mode === "page" ? page * PAGE_H : 0);
function pt(e) { const r = svg.getBoundingClientRect(); return { x: +((e.clientX - r.left) / Z).toFixed(1), y: +((e.clientY - r.top) / Z + offY()).toFixed(1), t: Math.round(e.timeStamp), p: e.pointerType === "pen" ? +(e.pressure || 0.5).toFixed(2) : 0.5 }; }
function pathD(pts) {
  if (!pts.length) return "";
  if (pts.length < 3) return `M${pts[0].x} ${pts[0].y}` + pts.slice(1).map((q) => ` L${q.x} ${q.y}`).join("") + (pts.length === 1 ? ` l0.1 0.1` : "");
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; d += ` Q${a.x} ${a.y} ${((a.x + b.x) / 2).toFixed(1)} ${((a.y + b.y) / 2).toFixed(1)}`; }
  const l = pts[pts.length - 1]; return d + ` L${l.x} ${l.y}`;
}

/* 중철(가운데 접기) 배치: 4쪽 배수로 빈 쪽을 채우고, 종이 s 앞면 = [끝-2s | 2s], 뒷면 = [2s+1 | 끝-1-2s] */
function bookletHtml(pgs) {
  const a = pgs.slice(); while (a.length % 4) a.push("");
  const N = a.length, half = (x) => `<div class="half"><div class="pg">${x}</div></div>`;
  let h = "";
  for (let s2 = 0; s2 < N / 4; s2++) {
    h += `<div class="pp2">${half(a[N - 1 - 2 * s2])}${half(a[2 * s2])}</div>`;
    h += `<div class="pp2">${half(a[2 * s2 + 1])}${half(a[N - 2 - 2 * s2])}</div>`;
  }
  return h;
}
