<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노트 · 트릭스터디</title>
<link rel="icon" href="assets/chibi/erpin.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="js/sado.js"></script>
<script src="js/spine-data.js"></script>
<style>
:root {
  --ink: #3b2a20; --ink-soft: #7a6253; --cream: #fff8e6; --cream-2: #fdecc8; --paper: #fffdf6;
  --yellow: #ffd34e; --pink: #ff8fb1; --pink-d: #e0577f; --mint: #7fd6c2; --sky: #8fd3ff; --red: #ff7b6e; --purple: #b77cff;
  --line: 3px solid var(--ink); --shadow: 0 4px 0 var(--ink); --radius: 18px;
  --font-title: "Jua", "Gowun Dodum", system-ui, sans-serif; --font-body: "Gowun Dodum", "Jua", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font: 15px/1.45 var(--font-body); padding: 12px 16px 40px; }
h1 { font: 22px var(--font-title); margin: 0; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.top img { width: 46px; height: 46px; border: var(--line); border-radius: 14px; background: var(--paper); }
.top a { margin-left: auto; color: var(--ink-soft); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 13px var(--font-title); padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
.chip.ok { background: var(--mint); } .chip.no { background: var(--red); color: #fff; } .chip.wait { background: var(--cream-2); }
.say { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 10px; }
.say p { margin: 0; padding: 8px 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; font-size: 14px; flex: 1; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { font: 14px var(--font-title); border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--yellow); }
.btn { font: 14px var(--font-title); border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 6px 12px; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); }
label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
select { font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 6px; background: var(--paper); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.paper { position: relative; border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; height: 70vh; background: #e9dcc4; overscroll-behavior: contain; padding: 14px 0; }
#board { display: block; margin: 0 auto; touch-action: none; cursor: crosshair; background: #fff; box-shadow: 0 2px 10px rgba(59, 42, 32, .25); }
.nbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.nbar .ntitle { flex: 2; min-width: 180px; font: 18px var(--font-title); border: 2px solid var(--ink); border-radius: 12px; padding: 5px 10px; background: var(--paper); color: var(--ink); }
.nbar .psum { flex: 3; min-width: 200px; display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 12px; padding: 2px 4px 2px 10px; background: var(--paper); }
.nbar .psum b { font: 13px var(--font-title); white-space: nowrap; }
.nbar .psum input { flex: 1; border: 0; outline: none; font: 14px var(--font-body); background: transparent; padding: 4px; color: var(--ink); }
.zoom { display: inline-flex; align-items: center; gap: 4px; font: 13px var(--font-title); }
.zoom .btn { padding: 3px 8px; }
#zNum { min-width: 42px; text-align: center; }
.pageBg { fill: #fff; }
.ruled { stroke: #f0dcb4; stroke-width: 1; }
.gridL { stroke: #eef0f4; stroke-width: 1; }
.marginL { stroke: #ffc2c2; stroke-width: 1.2; }
/* PDF (인쇄) */
#print { display: none; }
@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .pp { width: 210mm; height: 297mm; overflow: hidden; page-break-after: always; break-after: page; position: relative; }
  .pp:last-child { page-break-after: auto; break-after: auto; }
  .pp svg { width: 210mm; height: 297mm; display: block; }
}
.cover { width: 210mm; height: 297mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10mm; background: linear-gradient(#fff8e6, #fdecc8); font-family: var(--font-title); color: var(--ink); text-align: center; }
.cover .cv-frame { width: 120mm; height: 150mm; border: 2mm solid var(--ink); border-radius: 12mm; background: #fffdf6 radial-gradient(circle at 50% 35%, #fff 0, #ffe9b8 70%); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.cover .cv-frame img { width: 100%; height: 100%; object-fit: contain; }
.cover h1 { font-size: 15mm; margin: 0; line-height: 1.2; max-width: 180mm; }
.cover .cv-sub { font: 6mm var(--font-body); color: var(--ink-soft); }
.cover .cv-badge { font-size: 5mm; padding: 2mm 6mm; border: 1mm solid var(--ink); border-radius: 99mm; background: var(--yellow); }
.tb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 4px 0; }
.tb .seg button { padding: 4px 7px; font-size: 13px; }
.tb .btn { padding: 4px 7px; font-size: 13px; }
.tb { gap: 5px; }
.tbR { margin-left: auto; display: inline-flex; gap: 6px; }
.btn.mint { background: var(--mint); } .btn.sky { background: var(--sky); }
.btn.off { opacity: .55; }
.pnav { display: inline-flex; align-items: center; gap: 6px; font: 14px var(--font-title); }
.pnav[hidden] { display: none; }
body.focus #settings { display: none; }
body.focus { padding-top: 6px; }
body.noside .wrap { grid-template-columns: 1fr; }
body.noside .side { display: none; }
.side { max-height: 80vh; overflow-y: auto; }
.pageLine { stroke: #c9a46a; stroke-width: 1.5; stroke-dasharray: 10 8; }
.pageNo { font: 12px var(--font-title); fill: #b08d5a; }
.head { font: 24px var(--font-title); fill: #2f5fb0; }
.headBg { fill: #fff1a8; }
#board * { pointer-events: none; } /* 펜 입력은 항상 판 전체가 받음 (상자를 다시 그려도 끊기지 않게) */
#board.move { cursor: grab; } #board.erase { cursor: cell; }
.stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.box { fill: none; stroke-width: 2; stroke-dasharray: 6 5; rx: 10; }
.box.text { stroke: #4aa3df; fill: rgba(143, 211, 255, .08); } .box.draw { stroke: #e0577f; fill: rgba(255, 143, 177, .08); }
.box.label { stroke-dasharray: 2 4; }
.setBox { fill: rgba(183, 124, 255, .06); stroke: #b77cff; stroke-width: 2.5; stroke-dasharray: 10 6; }
.grip { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.grip.on { fill: var(--pink); }
.gripMark { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; fill: none; }
.box.sel { stroke-dasharray: none; stroke-width: 3; }
.tag { font: 12px var(--font-title); }
.clean { font-family: var(--font-body); fill: var(--ink); }
.cleanF { display: inline-block; font-family: var(--font-body); color: var(--ink); white-space: nowrap; overflow: visible; }
.cleanF .katex { font-size: 1em; }
.cleanB { display: inline-block; font-family: var(--font-body); color: var(--ink); line-height: 1.55; white-space: nowrap; }
.cleanB > div { white-space: nowrap; width: max-content; }
.cleanB .katex { font-size: 1.05em; }
.card .txt .katex { font-size: 1.05em; }
.ai { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 12px; margin-bottom: 10px; }
.ai summary { cursor: pointer; font: 15px var(--font-title); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aiIn { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.aiIn input[type=password] { flex: 1; min-width: 200px; font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; }
.ai .meta { margin: 4px 0; }
mark.uns { background: #ffe08a; border-bottom: 2px dotted #d8483b; color: inherit; border-radius: 3px; }
.chk { font-size: 12px; margin-top: 4px; padding: 4px 6px; border-radius: 8px; background: #eaf6ff; border: 1.5px dashed #2f7fd0; }
.side { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; }
.card h3 { margin: 0 0 4px; font: 15px var(--font-title); display: flex; align-items: center; gap: 6px; }
.card .k { font: 12px var(--font-title); padding: 1px 8px; border-radius: 999px; border: 2px solid var(--ink); cursor: pointer; }
.card .k.text { background: var(--sky); } .card .k.draw { background: var(--pink); }
.card .txt { white-space: pre-wrap; font-size: 16px; min-height: 1.4em; outline: none; border-radius: 8px; padding: 2px 4px; }
.card .txt:focus { background: var(--cream-2); }
.alts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.alts button { font: 12px var(--font-body); border: 1.5px solid var(--ink-soft); background: #fff; border-radius: 8px; padding: 1px 6px; cursor: pointer; }
.meta { font-size: 11px; color: var(--ink-soft); }
.card.sel { background: var(--cream-2); }
.empty { color: var(--ink-soft); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 12px; font: 14px var(--font-title); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="nbar">
  <a class="btn" href="./#note" id="backBtn" title="노트 목록으로">←</a>
  <input id="title" class="ntitle" placeholder="노트 제목 (과목·단원 — AI가 참고해요)" autocomplete="off">
  <label class="psum" title="이 페이지가 무슨 내용인지 짧게 — AI가 글을 읽을 때 참고해요"><b id="pLabel">1쪽</b><input id="pSum" placeholder="이 페이지 요약" autocomplete="off"></label>
  <span class="meta" id="saveState">저장됨</span>
  <button class="btn pink" id="pdfBtn" title="A4 PDF 로 저장 (첫 장에 대표 사도와 제목)">📕 PDF</button>
</div>
<div id="settings">
<div class="say"><p id="say">스타일러스로 써 보세요! 잠깐 멈추면 글은 읽고, 그림은 따로 묶어 둘게요.</p></div>
<div class="bar">
  <label class="opt">종이 <select id="paperSel"><option value="lined">줄 노트</option><option value="blank">무지</option><option value="grid">격자</option></select></label>
  <label class="opt">묶기 간격 <input type="range" id="gap" min="10" max="80" value="34"></label>
  <label class="opt"><input type="checkbox" id="penOnly" checked> 펜만 쓰기(손바닥 무시)</label>
  <label class="opt" title="같은 자리를 펜으로 빠르게 2번 = 펜↔선택, 3번 = 그 덩어리 글↔그림"><input type="checkbox" id="tapKeys" checked> 따닥 단축키</label>
  <label class="opt"><input type="checkbox" id="gAuto" checked> 쓰다 멈추면 자동으로 읽기</label>
  <label class="opt"><input type="checkbox" id="gCheck"> 💡 개념 확인 메모</label>
  <span class="meta" id="gUse"></span>
  <button class="btn" id="clear">🗑 이 노트 전부 지우기</button>
</div>
</div>
<div class="tb" id="tb">
  <span class="seg" id="tool"><button data-v="pen" class="on">✏️ 펜</button><button data-v="erase">🧽 지우개</button><button data-v="move" title="선택: 덩어리를 끌면 옮기기 · 빈 곳에서 빙 둘러 그리면 묶기 · 노란 손잡이로 크기 (펜으로 따닥 = 펜↔선택)">✋ 선택</button></span>
  <span class="seg" id="view"><button data-v="ink">원본</button><button data-v="both" class="on">겹쳐</button><button data-v="clean">정리본</button><button data-v="final" title="상자·표시 없이 완전히 정리된 모습만">완성본</button></span>
  <span class="seg" id="color"><button data-v="#3b2a20" class="on">⚫</button><button data-v="#d8483b">🔴</button><button data-v="#2f7fd0">🔵</button><button data-v="#2e9e6a">🟢</button></span>
  <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)">↶</button>
  <button class="btn" id="gNow" title="지금 읽기 — 자동 읽기를 껐을 때 이 버튼으로 한 번에 읽어요">📖 읽기</button>
  <button class="btn" id="photoBtn" title="사진 올리기 (붙여넣기 Ctrl+V, 끌어다 놓기도 돼요)">🖼 사진</button><input type="file" id="photoIn" accept="image/*" multiple hidden>
  <button class="btn mint" id="layoutBtn" title="덩어리들을 읽는 순서대로 가지런히 (AI 안 씀)">✨ 배치</button>
  <button class="btn sky" id="tidyBtn" title="Gemini 가 내용 흐름을 보고 순서·소제목을 정해서 배치">🤖 AI 정리</button>
  <span class="seg" id="mode"><button data-v="inf" class="on" title="아래로 계속 늘어나는 노트">📜 무한</button><button data-v="page" title="한 장씩 넘기는 노트">📄 페이지</button></span>
  <span class="pnav" id="pnav" hidden><button class="btn" id="pPrev">◀</button><b id="pNum">1 / 1</b><button class="btn" id="pNext">▶</button></span>
  <span class="zoom"><button class="btn" id="zOut" title="축소">－</button><b id="zNum">100%</b><button class="btn" id="zIn" title="확대">＋</button><button class="btn" id="zFit" title="폭에 맞추기">↔</button></span>
  <span class="tbR">
    <button class="btn" id="sideT" title="오른쪽 덩어리 목록 보이기/숨기기">📋</button>
    <button class="btn" id="setT" title="설정 칸 보이기/숨기기">⚙️</button>
  </span>
</div>

<div class="wrap">
  <div class="paper" id="paper"><svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="gPages"></g><g id="gBoxes"></g><g id="gHeads"></g><g id="gInk"></g><g id="gClean"></g><g id="gLive"></g></g></svg></div>
  <div class="side" id="side"><div class="card empty">아직 덩어리가 없어요. 써 보세요!</div></div>
</div>
<div id="toast"></div>
<div id="print"></div>

<script>
"use strict";
/* ───────── 상태 ───────── */
const $ = (id) => document.getElementById(id) || document.createElement("i"); // (없는 칸은 빈 요소로 — 옛 테스트 화면과 코드 공유)
const svg = $("board"), NS = "http://www.w3.org/2000/svg";
const PAGE_W = 794, PAGE_H = 1123; // A4 (96dpi 기준 210×297mm)
const NOTE_ID = new URLSearchParams(location.search).get("id");
let note = null, Z = 1, zFit = true; // 지금 노트 기록 · 확대 배율
let strokes = [], meta = {}, nextId = 1, tool = "pen", view = "both", color = "#3b2a20", sel = null;
let blocks = [];
let heads = [], mode = "inf", page = 0, pageH = PAGE_H, focusUI = true, sideOn = false, noteTitle = ""; // 노트 모드·제목
const undoStack = [];
const env = { api: "none", ko: null, en: null, inputs: new Set() };
let recognizer = null, recLang = null;

/* 노트 저장: 브라우저 저장소(IndexedDB) "trickstudy-notes" 에 노트마다 따로 */
let saveT = 0;
function save() { clearTimeout(saveT); $("saveState").textContent = "저장 중…"; saveT = setTimeout(saveNow, 600); }
async function saveNow() {
  saveT = 0;
  if (!note) return;
  Object.assign(note, {
    title: $("title").value.trim() || "제목 없는 노트", paper: $("paperSel").value,
    data: { strokes, meta, nextId, heads }, mode, page, zoom: zFit ? 0 : Z, view, focusUI, sideOn,
    check: $("gCheck").checked, auto: $("gAuto").checked, updated: Date.now(), scroll: Math.round(paper.scrollTop),
    stats: { pages: pageCount(), blocks: blocks.length, imgs: strokes.filter((st) => st.img).length },
  });
  try { await notePut(note); $("saveState").textContent = "저장됨 ✓"; } catch (e) { $("saveState").textContent = "⚠️ 저장 실패"; toast("저장하지 못했어요: " + (e.message || e)); }
}
addEventListener("pagehide", () => { if (saveT) { clearTimeout(saveT); saveNow(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && saveT) { clearTimeout(saveT); saveNow(); } });
async function loadNote() {
  let n = NOTE_ID ? await noteGet(NOTE_ID) : null;
  if (!n) { // 주소에 노트가 없으면 새 노트
    n = { id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: "새 노트", paper: "lined", created: Date.now(), updated: Date.now(), pages: [] };
    history.replaceState(null, "", "?id=" + n.id);
  }
  note = n; note.pages = note.pages || [];
  const d = n.data || {};
  strokes = d.strokes || []; meta = d.meta || {}; nextId = d.nextId || 1; heads = d.heads || [];
  mode = n.mode || "inf"; page = n.page || 0; view = n.view || "both";
  focusUI = n.focusUI !== false; sideOn = !!n.sideOn;
  if (n.zoom) { Z = n.zoom; zFit = false; }
  $("title").value = n.title || ""; $("paperSel").value = n.paper || "lined";
  $("gCheck").checked = !!n.check; $("gAuto").checked = n.auto !== false;
  document.title = (n.title || "노트") + " · 트릭스터디";
}
function snapshot() { undoStack.push(JSON.stringify({ strokes, meta, heads })); if (undoStack.length > 60) undoStack.shift(); }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function say(t) { $("say").textContent = t; if (focusUI) toast(t); }

/* ───────── 손글씨 인식 API 확인 ───────── */
async function query(lang) {
  const n = navigator;
  try {
    if (n.queryHandwritingRecognizer) return await n.queryHandwritingRecognizer({ languages: [lang] });
    if (n.queryHandwritingRecognizerSupport) { const r = await n.queryHandwritingRecognizerSupport({ languages: [lang] }); return r && r.languages ? r : null; }
  } catch (e) { return null; }
  return null;
}
async function checkApi() {
  if (!("createHandwritingRecognizer" in navigator)) env.api = "none";
  else { env.api = "yes"; env.ko = await query("ko"); env.en = await query("en"); }
  // (Gemini 키가 없을 때만 쓰는 예비 인식기라 따로 표시하지 않음)
  if (!gem.key) say("⚙️ 설정의 🔑 AI 인식에 Gemini 키를 넣으면 한국어·수식까지 읽어요.");
}
async function getRecognizer() {
  const lang = env.ko ? "ko" : "en"; // 키가 없을 때만 쓰는 크롬 내장 인식
  if (recognizer && recLang === lang) return recognizer;
  if (env.api !== "yes") return null;
  try { if (recognizer && recognizer.finish) recognizer.finish(); } catch (e) { /* 무시 */ }
  try { recognizer = await navigator.createHandwritingRecognizer({ languages: [lang] }); recLang = lang; }
  catch (e) { recognizer = null; recLang = null; toast("인식기를 못 만들었어요: " + (e.message || e.name)); }
  return recognizer;
}

    const ub = new Map(units().map((x) => [x.b, x.box])); for (const u of us) if (ub.has(u.b)) u.box = ub.get(u.b);
    noteTitle = String(data.title || "").slice(0, 30);
    if (noteTitle && (!$("title").value.trim() || $("title").value.trim() === "새 노트")) { $("title").value = noteTitle; }
    const { plan, newHeads } = planLayout(sections);
    animateTo(plan, newHeads, () => { if (mode === "page") goPage(0); else paper.scrollTo({ top: 0, behavior: "smooth" }); });
    say(`🤖 「${noteTitle || "노트"}」 — 소단원 ${sections.length}개로 정리했어요! 마음에 안 들면 ↶ 되돌리기, 소제목은 ✋ 옮기기로 끌거나 🧽 지우개로 지울 수 있어요.`);
    document.title = ($("title").value || "노트") + " · 트릭스터디";
  } catch (e) { say("AI 정리 실패: " + e.message); toast("AI 정리 실패: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "🤖 AI 정리"; }
};

/* ───────── 🖼 사진: 브라우저 저장소(IndexedDB)에 넣고, 노트엔 "사진 획"으로 ─────────
   사진도 테두리 점들로 된 획처럼 다뤄서 옮기기·크기 조절·세트·배치·AI 정리가 그대로 됨 */
let idbP = null;
// 노트와 사진은 같은 저장소 "trickstudy-notes" (트릭스터디 노트 탭도 같은 곳을 씀)
function idb() { return idbP || (idbP = new Promise((ok, no) => { const r = indexedDB.open("trickstudy-notes", 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", { keyPath: "id" }); if (!d.objectStoreNames.contains("img")) d.createObjectStore("img"); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); })); }
async function noteGet(id) { const db = await idb(); return new Promise((ok) => { const r = db.transaction("notes").objectStore("notes").get(id); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); }); }
async function notePut(n) { const db = await idb(); return new Promise((ok, no) => { const t = db.transaction("notes", "readwrite"); t.objectStore("notes").put(n); t.oncomplete = ok; t.onerror = () => no(t.error); }); }
async function imgPut(id, blob) { const db = await idb(); return new Promise((ok, no) => { const t = db.transaction("img", "readwrite"); t.objectStore("img").put(blob, id); t.oncomplete = ok; t.onerror = () => no(t.error); }); }
async function imgGet(id) { const db = await idb(); return new Promise((ok) => { const r = db.transaction("img").objectStore("img").get(id); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); }
const imgCache = new Map(), imgLoading = new Map();
function loadImg(id) {
  if (imgCache.has(id)) return Promise.resolve(imgCache.get(id));
  if (!imgLoading.has(id)) imgLoading.set(id, (async () => {
    try { const blob = await imgGet(id); if (!blob) return null; const url = URL.createObjectURL(blob), im = new Image(); im.src = url; try { await im.decode(); } catch (e) { /* 무시 */ } const o = { url, el: im }; imgCache.set(id, o); return o; }
    catch (e) { return null; }
  })());
  return imgLoading.get(id);
}
function imgPts(x, y, w, h) {
  const n = Math.max(2, Math.round((w + h) / 24)), pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push({ x: x + w * t, y }, { x: x + w * t, y: y + h }, { x, y: y + h * t }, { x: x + w, y: y + h * t }); }
  return pts.map((q) => ({ x: +q.x.toFixed(1), y: +q.y.toFixed(1), t: 0, p: 0.5 }));
}
async function addPhoto(file, at) {
  if (!file || !/^image\//.test(file.type)) return toast("사진 파일만 올릴 수 있어요");
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)); // 긴 변 1600px 로 줄여서 저장 공간 아끼기
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
    const id = "img" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await imgPut(id, blob); await loadImg(id);
    const W = PAGE_W, w = Math.min(420, W * 0.45, c.width), h = (w * c.height) / c.width;
    const top = mode === "page" ? page * PAGE_H : paper.scrollTop / Z;
    let x = M, y = top + 40;
    if (at) { x = at.x; y = at.y; }
    else { // 지금 보이는 곳에서 다른 덩어리와 안 겹치는 빈자리 찾기
      const free = (xx, yy) => !blocks.some((b) => near({ x: xx, y: yy, w, h }, b.box, 14)) && !heads.some((hd) => near({ x: xx, y: yy, w, h }, headBox(hd), 8));
      let found = false;
      for (let yy = top + 40; yy < top + (paper.clientHeight / Z) * 2 && !found; yy += 40) for (let xx = M; xx + w <= W - M && !found; xx += 40) if (free(xx, yy)) { x = xx; y = yy; found = true; }
      if (!found) { x = M; y = contentBottom() + 40; }
    }
    snapshot();
    const st = { id: nextId++, img: id, pts: imgPts(x, y, w, h), w: 1, c: "#000" };
    st.lock = "L" + st.id; st.lockAt = nextId; // 사진은 처음부터 따로 (그 뒤 옆에 쓴 설명은 붙을 수 있음)
    strokes.push(st); regroup(); fitBoard(); save();
    sel = st.lock; setTool("move"); toast("🖼 사진을 넣었어요 — 노란 손잡이로 크기, 끌어서 위치를 바꿔요");
  } catch (e) { toast("사진을 못 넣었어요: " + (e.message || e)); }
}
$("photoBtn").onclick = () => $("photoIn").click();
$("photoIn").onchange = async (e) => { for (const f of e.target.files) await addPhoto(f); e.target.value = ""; };
document.addEventListener("paste", async (e) => {
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  const fs = [...(e.clipboardData ? e.clipboardData.files : [])].filter((f) => /^image\//.test(f.type));
  if (fs.length) { e.preventDefault(); for (const f of fs) await addPhoto(f); }
});
paper.addEventListener("dragover", (e) => { e.preventDefault(); });
paper.addEventListener("drop", async (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), at = { x: (e.clientX - r.left) / Z, y: (e.clientY - r.top) / Z + offY() };
  for (const f of e.dataTransfer.files) { await addPhoto(f, at); at.x += 30; at.y += 30; }
});

/* ───────── 도구 ───────── */
function seg(id, cb) { $(id).querySelectorAll("button").forEach((bt) => (bt.onclick = () => { $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === bt)); cb(bt.dataset.v); })); }
seg("tool", (v) => { tool = v; setTimeout(() => render(true)); svg.classList.toggle("move", v === "move"); svg.classList.toggle("erase", v === "erase"); if (v === "move") say("✋ 선택: 덩어리를 끌면 옮기기, 빈 곳에서 빙 둘러 그리면 묶기(그림+글을 감싸면 세트), 노란 손잡이로 크기 조절이에요."); if (v !== "move") { sel = null; render(); } });
seg("view", (v) => { view = v; render(); clearTimeout(saveT); saveNow(); });
seg("color", (v) => (color = v));
$("gap").oninput = () => { regroup(); };
$("gap").onchange = () => { save(); scheduleRecognize(); };
$("undo").onclick = () => { const s = undoStack.pop(); if (!s) return toast("더 되돌릴 게 없어요"); const d = JSON.parse(s); strokes = d.strokes; meta = d.meta; heads = d.heads || []; regroup(); fitBoard(); save(); scheduleRecognize(); };
$("clear").onclick = () => { if (!strokes.length && !heads.length) return; snapshot(); strokes = []; meta = {}; heads = []; sel = null; regroup(); fitBoard(); save(); toast("다 지웠어요 (되돌리기 가능)"); };
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("undo").click(); }
  if (mode === "page" && !e.target.closest("input,textarea,[contenteditable]")) { if (e.key === "PageDown" || e.key === "ArrowRight") goPage(page + 1); if (e.key === "PageUp" || e.key === "ArrowLeft") goPage(page - 1); }
});

/* ───────── 📕 PDF (A4) ─────────
   브라우저 인쇄 → "PDF로 저장". 첫 장 = 대표 사도(움직이는 모습을 한 장 찍음) + 제목, 그다음 노트 장들을 완성본 모습으로 */
function loadScript(src) { return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
function patchPMA() { // 이음새 선 방지 (사이트와 같은 방식)
  const T = window.spine && spine.GLTexture;
  if (!T || T.__pma) return;
  T.__pma = true; T.DISABLE_UNPACK_PREMULTIPLIED_ALPHA_WEBGL = false;
  const up = T.prototype.update;
  T.prototype.update = function (mip) { const gl = this.context.gl; gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true); try { up.call(this, mip); } finally { gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); } };
}
function snapSpine(base) {
  return new Promise((ok) => {
    const host = document.createElement("div"); host.style.cssText = "position:fixed;left:-3000px;top:0;width:600px;height:800px";
    document.body.appendChild(host);
    let done = false, pl = null;
    const fin = (v) => { if (done) return; done = true; setTimeout(() => { try { pl.dispose(); } catch (e) { /* 무시 */ } host.remove(); }, 50); ok(v); };
    const to = setTimeout(() => fin(null), 15000);
    pl = new spine.SpinePlayer(host, {
      skelUrl: base + ".skel.asset", atlasUrl: base + ".atlas.asset", showControls: false, showLoading: false,
      alpha: true, backgroundColor: "#00000000", premultipliedAlpha: true, preserveDrawingBuffer: true,
      viewport: { padLeft: 0, padRight: 0, padTop: 0, padBottom: 0, transitionTime: 0 },
      success: (p) => {
        clearTimeout(to);
        const data = p.skeleton.data, anims = data.animations.map((a) => a.name), idle = anims.find((n) => /^Idle_/.test(n)) || anims[0];
        const sk = data.skins.find((x) => x.name === "Normal") || data.skins.find((x) => x.name !== "default");
        if (sk) { p.skeleton.setSkin(sk); p.skeleton.setSlotsToSetupPose(); }
        p.animationState.setAnimation(0, idle, true); p.animationState.apply(p.skeleton); p.skeleton.updateWorldTransform();
        const off = new spine.Vector2(), size = new spine.Vector2(); p.skeleton.getBounds(off, size);
        const good = Number.isFinite(off.y) && size.y > 0 && size.y < 5000;
        const H = (good ? Math.min(Math.max(off.y + size.y + 30, 650), 1150) : 900) + 60, W = H * 0.78; // 발끝~머리 위, 전신 (동작용 여유)
        // 표지 표정은 매번 무작위: 기쁨·뿌듯·부끄럼·춤·대기 중 하나를, 동작 중 아무 순간에 찰칵
        const pool = anims.filter((n) => /^(Happy|Proud|Pride|Shy|Dance|Smile|Laugh|Idle)_/.test(n));
        const pick = pool.length ? pool[Math.floor(Math.random() * pool.length)] : idle;
        p.animationState.setAnimation(0, pick, true);
        const dur = (data.findAnimation(pick) || {}).duration || 1;
        p.animationState.update(Math.random() * dur); p.animationState.apply(p.skeleton); p.skeleton.updateWorldTransform();
        Object.assign(p.config.viewport, { x: -W / 2, y: -30, width: W, height: H }); p.setViewport(pick);
        if (p.paused) p.play();
        setTimeout(() => { try { if (p.drawFrame) p.drawFrame(false); fin(host.querySelector("canvas").toDataURL("image/png")); } catch (e) { fin(null); } }, 500 + Math.random() * 900);
      },
      error: () => { clearTimeout(to); fin(null); },
    });
  });
}
async function coverSado() {
  let st = {}; try { st = JSON.parse(localStorage.getItem("trickcal-study") || "{}") || {}; } catch (e) { st = {}; }
  const id = st.partner || "erpin", c = (typeof SADO !== "undefined" && SADO.find((x) => x.id === id)) || {};
  const res = { name: c.name || "", src: `assets/chibi/${id}.webp` };
  if (typeof SPINE_DATA === "undefined" || !SPINE_DATA[id]) return res;
  try { await loadScript("js/vendor/spine-player.min.js"); patchPMA(); } catch (e) { return res; }
  const d = SPINE_DATA[id], idx = Math.min(((st.skins || {})[id] || {}).cur || 0, d.skins.length - 1);
  for (const h of SPINE_HOSTS) { const src = await snapSpine(encodeURI(h.url + h.dir(d.dir) + "/" + d.skins[idx][0])); if (src) { res.src = src; break; } }
  return res;
}
$("pdfBtn").onclick = async () => {
  const btn = $("pdfBtn"); if (btn.disabled) return;
  btn.disabled = true; btn.textContent = "📕 준비 중…";
  const before = view;
  try {
    await saveNow();
    const cov = await coverSado();
    view = "final"; render(true); // 완성본 모습으로
    const n = Math.max(1, Math.ceil((contentBottom() + 1) / PAGE_H)), kind = $("paperSel").value;
    const world = $("world").cloneNode(true);
    world.querySelector("#gLive").remove(); world.querySelector("#gPages").innerHTML = ""; world.querySelectorAll("[id]").forEach((x) => x.removeAttribute("id"));
    const inner = world.innerHTML;
    const title = esc($("title").value.trim() || "노트"), date = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
    const sums = note.pages.map((p2, i) => (p2 && p2.summary ? `<div>${i + 1}쪽 · ${esc(p2.summary)}</div>` : "")).join("");
    let h = `<div class="pp"><div class="cover"><div class="cv-badge">트릭스터디 노트</div><div class="cv-frame"><img src="${cov.src}" alt=""></div>
      <h1>${title}</h1><div class="cv-sub">${date}${cov.name ? ` · 대표 사도 ${esc(cov.name)}` : ""} · ${n}쪽</div>${sums ? `<div class="cv-sub" style="font-size:4.2mm;line-height:1.6">${sums}</div>` : ""}</div></div>`;
    for (let i = 0; i < n; i++) h += `<div class="pp"><svg xmlns="${NS}" viewBox="0 ${i * PAGE_H} ${PAGE_W} ${PAGE_H}"><g>${paperMarkup(i, kind)}</g><g>${inner}</g></svg></div>`;
    $("print").innerHTML = h;
    await Promise.all([...$("print").querySelectorAll("img")].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    toast("인쇄 창에서 대상: ‘PDF로 저장’, 용지: A4 를 골라 주세요");
    await new Promise((r) => setTimeout(r, 300));
    const old = document.title; document.title = $("title").value.trim() || "노트"; // PDF 파일 이름
    window.print();
    document.title = old;
  } catch (e) { toast("PDF 준비 실패: " + (e.message || e)); }
  finally { view = before; render(); btn.disabled = false; btn.textContent = "📕 PDF"; }
};

/* ───────── 시작 ───────── */
(async () => {
  renderAi(); saveFixes(); showUse();
  try { await loadNote(); } catch (e) { toast("노트를 불러오지 못했어요: " + (e.message || e)); return; }
  Object.values(meta).forEach((m) => { if (m.lines && m.lines.some((l) => !l.rel)) { m.lines = null; m.stale = true; } if (m.lines) m.lines.forEach((l) => { l.text = fixArrow(fixTex(l.text)); }); });
  $("mode").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.v === mode));
  $("view").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.v === view));
  applyUI(); fitPaper(); regroup(); fitBoard();
  if (mode === "inf" && note.scroll) paper.scrollTop = note.scroll;
  Promise.all(strokes.filter((s) => s.img).map((s) => loadImg(s.img))).then(() => render(true));
  checkApi().then(() => { blocks.forEach((b) => (b.m.stale = b.m.stale || !b.m.lines)); scheduleRecognize(); });
  if (new URLSearchParams(location.search).get("pdf")) { history.replaceState(null, "", "?id=" + encodeURIComponent(note.id)); setTimeout(() => $("pdfBtn").click(), 600); } // 노트 목록의 📕 PDF
})();
// ← 노트: 저장을 끝낸 뒤 목록으로
$("backBtn").onclick = async (e) => { e.preventDefault(); clearTimeout(saveT); $("saveState").textContent = "저장 중…"; await saveNow(); location.href = "./#note"; };
