<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; padding: 14px; font: 14px/1.4 "Jua", "Gowun Dodum", system-ui, sans-serif; color: #3b2a20; background: #fff8e6; }
  h1 { margin: 0 0 10px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #3b2a20; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  label.sw { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; cursor: pointer; }
  select { font: inherit; padding: 4px 6px; border: 2px solid #3b2a20; border-radius: 10px; background: #fff; max-width: 160px; }
  .seg { display: inline-flex; border: 2px solid #3b2a20; border-radius: 10px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: #fff; padding: 3px 10px; cursor: pointer; }
  .seg button.on { background: #ffd54f; }
  .hint { font-size: 12px; color: #7a6a5c; margin: 6px 0 0; }
  hr { border: 0; border-top: 2px dashed #e8d6ad; margin: 10px 0; }
  .pick[hidden] { display: none; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #e0577f; }
</style>
</head>
<body>
<h1><img src="icon48.png" alt="">트릭스터디 펫</h1>
<label class="sw">사도 띄우기 <input type="checkbox" id="enabled"></label>
<label class="sw">돌아다니기 <input type="checkbox" id="walk"></label>
<div class="row">크기 <span class="seg" id="size"><button data-v="s">작게</button><button data-v="m">보통</button><button data-v="l">크게</button></span></div>
<hr>
<label class="sw">트릭스터디 대표 사도 따라가기 <input type="checkbox" id="follow"></label>
<div class="pick" id="pick">
  <div class="row">사도 <select id="sado"></select></div>
  <div class="row">스킨 <select id="skin"></select></div>
</div>
<p class="hint" id="cur"></p>
<hr>
<label class="sw"><span>이 사이트에서는 숨기기<br><small id="host"></small></span> <input type="checkbox" id="hide"></label>
<label class="sw">트릭스터디 사이트에서도 띄우기 <input type="checkbox" id="onSite"></label>
<p class="hint">누르면 반응하고, 꾹 누르면 쓰다듬기, 끌어서 옮기면 떨어져요.</p>
<script src="data.js"></script>
<script src="popup.js"></script>
</body>
</html>
