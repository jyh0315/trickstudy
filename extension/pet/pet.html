<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="spine-player.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #stage > div { position: absolute; inset: 0; }
  #fallback { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 78%; display: none; pointer-events: none; }
  #bubble { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); max-width: 92%; padding: 4px 9px; border: 2px solid #3b2a20; border-radius: 12px; background: #fff8e6;
    font: 12px/1.35 "Jua", "Gowun Dodum", sans-serif; color: #3b2a20; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: normal; word-break: keep-all; }
  #bubble.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<img id="fallback" alt="">
<div id="bubble"></div>
<script src="spine-player.min.js"></script>
<script src="data.js"></script>
<script src="pet.js"></script>
</body>
</html>
