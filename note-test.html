<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>필기 인식 테스트 · 트릭스터디</title>
<link rel="icon" href="assets/chibi/erpin.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --ink: #3b2a20; --ink-soft: #7a6253; --cream: #fff8e6; --cream-2: #fdecc8; --paper: #fffdf6;
  --yellow: #ffd34e; --pink: #ff8fb1; --pink-d: #e0577f; --mint: #7fd6c2; --sky: #8fd3ff; --red: #ff7b6e; --purple: #b77cff;
  --line: 3px solid var(--ink); --shadow: 0 4px 0 var(--ink); --radius: 18px;
  --font-title: "Jua", "Gowun Dodum", system-ui, sans-serif; --font-body: "Gowun Dodum", "Jua", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font: 15px/1.45 var(--font-body); padding: 12px 16px 40px; }
h1 { font: 22px var(--font-title); margin: 0; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.top img { width: 46px; height: 46px; border: var(--line); border-radius: 14px; background: var(--paper); }
.top a { margin-left: auto; color: var(--ink-soft); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 13px var(--font-title); padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
.chip.ok { background: var(--mint); } .chip.no { background: var(--red); color: #fff; } .chip.wait { background: var(--cream-2); }
.say { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 10px; }
.say p { margin: 0; padding: 8px 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; font-size: 14px; flex: 1; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { font: 14px var(--font-title); border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--ink); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--yellow); }
.btn { font: 14px var(--font-title); border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 6px 12px; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); }
label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
select { font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 6px; background: var(--paper); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.paper { position: relative; border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden auto; height: 70vh; background: var(--paper); overscroll-behavior: contain; }
.paper.page { overflow: hidden auto; }
#board { display: block; width: 100%; height: 600px; touch-action: none; cursor: crosshair; background: repeating-linear-gradient(transparent 0 39px, #f0dcb4 39px 40px); }
.tb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 4px 0; }
.tb .seg button { padding: 5px 9px; }
.tb .btn { padding: 5px 9px; }
.tbR { margin-left: auto; display: inline-flex; gap: 6px; }
.btn.mint { background: var(--mint); } .btn.sky { background: var(--sky); }
.btn.off { opacity: .55; }
.pnav { display: inline-flex; align-items: center; gap: 6px; font: 14px var(--font-title); }
.pnav[hidden] { display: none; }
body.focus #settings { display: none; }
body.focus { padding-top: 6px; }
body.noside .wrap { grid-template-columns: 1fr; }
body.noside .side { display: none; }
.side { max-height: 80vh; overflow-y: auto; }
.pageLine { stroke: #c9a46a; stroke-width: 1.5; stroke-dasharray: 10 8; }
.pageNo { font: 12px var(--font-title); fill: #b08d5a; }
.head { font: 24px var(--font-title); fill: #2f5fb0; }
.headBg { fill: #fff1a8; }
#board * { pointer-events: none; } /* 펜 입력은 항상 판 전체가 받음 (상자를 다시 그려도 끊기지 않게) */
#board.move { cursor: grab; } #board.erase { cursor: cell; }
.stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.box { fill: none; stroke-width: 2; stroke-dasharray: 6 5; rx: 10; }
.box.text { stroke: #4aa3df; fill: rgba(143, 211, 255, .08); } .box.draw { stroke: #e0577f; fill: rgba(255, 143, 177, .08); }
.box.label { stroke-dasharray: 2 4; }
.setBox { fill: rgba(183, 124, 255, .06); stroke: #b77cff; stroke-width: 2.5; stroke-dasharray: 10 6; }
.grip { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.grip.on { fill: var(--pink); }
.gripMark { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; fill: none; }
.box.sel { stroke-dasharray: none; stroke-width: 3; }
.tag { font: 12px var(--font-title); }
.clean { font-family: var(--font-body); fill: var(--ink); }
.cleanF { font-family: var(--font-body); color: var(--ink); white-space: nowrap; overflow: visible; }
.cleanF .katex { font-size: 1em; }
.card .txt .katex { font-size: 1.05em; }
.ai { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 12px; margin-bottom: 10px; }
.ai summary { cursor: pointer; font: 15px var(--font-title); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aiIn { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.aiIn input[type=password] { flex: 1; min-width: 200px; font: 14px var(--font-body); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; }
.ai .meta { margin: 4px 0; }
mark.uns { background: #ffe08a; border-bottom: 2px dotted #d8483b; color: inherit; border-radius: 3px; }
.chk { font-size: 12px; margin-top: 4px; padding: 4px 6px; border-radius: 8px; background: #eaf6ff; border: 1.5px dashed #2f7fd0; }
.side { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; }
.card h3 { margin: 0 0 4px; font: 15px var(--font-title); display: flex; align-items: center; gap: 6px; }
.card .k { font: 12px var(--font-title); padding: 1px 8px; border-radius: 999px; border: 2px solid var(--ink); cursor: pointer; }
.card .k.text { background: var(--sky); } .card .k.draw { background: var(--pink); }
.card .txt { white-space: pre-wrap; font-size: 16px; min-height: 1.4em; outline: none; border-radius: 8px; padding: 2px 4px; }
.card .txt:focus { background: var(--cream-2); }
.alts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.alts button { font: 12px var(--font-body); border: 1.5px solid var(--ink-soft); background: #fff; border-radius: 8px; padding: 1px 6px; cursor: pointer; }
.meta { font-size: 11px; color: var(--ink-soft); }
.card.sel { background: var(--cream-2); }
.empty { color: var(--ink-soft); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 12px; font: 14px var(--font-title); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="settings">
<div class="top">
  <img src="assets/chibi/erpin.webp" alt="">
  <h1>필기 인식 테스트</h1>
  <a href="./">← 트릭스터디로</a>
</div>
<div class="say"><p id="say">스타일러스로 아무거나 써 보세요! 잠깐 멈추면 에르핀이 글은 읽고, 그림은 따로 묶어 둘게요.</p></div>

<div class="bar">
  
  
  
  <label class="opt">묶기 간격 <input type="range" id="gap" min="10" max="80" value="34"></label>
  <label class="opt"><input type="checkbox" id="penOnly" checked> 펜만 쓰기(손바닥 무시)</label>
  <label class="opt" title="같은 자리를 펜으로 빠르게 2번 = 펜↔직접 묶기, 3번 = 그 덩어리 글↔그림"><input type="checkbox" id="tapKeys" checked> 따닥 단축키</label>
  
  <button class="btn" id="clear">🗑 전부 지우기</button>
  
  <button class="btn pink" id="copy">📋 결과 복사</button>
</div>

<div class="bar"><label class="opt" style="flex:1">📚 과목·단원 <input id="topic" placeholder="예: 생명과학Ⅰ – 신경계 (적어 두면 그 단원 용어로 더 잘 읽어요)" style="flex:1;min-width:220px;font:14px var(--font-body);border:2px solid var(--ink);border-radius:10px;padding:5px 8px"></label></div>
<details class="ai" id="aiBox">
  <summary>🔑 AI 인식 설정 (Gemini) <span id="aiState" class="chip wait">키 없음 — 크롬 내장 인식 사용</span></summary>
  <div class="aiIn">
    <input type="password" id="gKey" placeholder="Gemini API 키 붙여 넣기 (AIza…)" autocomplete="off" spellcheck="false">
    <button class="btn" id="gSave">저장·확인</button>
    <select id="gModel" hidden></select>
    <button class="btn" id="gDel">키 지우기</button>
  </div>
  <div class="aiIn">
    <label class="opt"><input type="checkbox" id="gCheck"> 💡 개념이 틀린 것 같으면 메모 달기 (글은 안 고침)</label>
    <label class="opt"><input type="checkbox" id="gAuto" checked> 쓰다 멈추면 자동으로 읽기</label>
    <span class="meta" id="gUse"></span>
  </div>
  <div class="aiIn">
    <span class="meta" id="fixInfo"></span> <button class="btn" id="fixClear" style="padding:2px 8px;font-size:12px">고친 기록 지우기</button>
  </div>
  <p class="meta">키는 이 크롬북 브라우저에만 저장돼요(사이트·GitHub엔 안 올라감). 글 덩어리를 그림으로 만들어 구글 Gemini 로 보내서 읽어요. 쓰다 멈추고 2.5초 뒤 한 번에 보내요.</p>
</details>
</div>
<div class="tb" id="tb">
  <span class="seg" id="tool"><button data-v="pen" class="on">✏️ 펜</button><button data-v="erase">🧽 지우개</button><button data-v="move">✋ 옮기기</button><button data-v="lasso" title="직접 묶기 (펜으로 따닥)">🪢 묶기</button></span>
  <span class="seg" id="view"><button data-v="ink">원본</button><button data-v="both" class="on">겹쳐</button><button data-v="clean">정리본</button></span>
  <span class="seg" id="color"><button data-v="#3b2a20" class="on">⚫</button><button data-v="#d8483b">🔴</button><button data-v="#2f7fd0">🔵</button><button data-v="#2e9e6a">🟢</button></span>
  <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)">↶</button>
  <button class="btn" id="gNow" title="지금 읽기 — 자동 읽기를 껐을 때 이 버튼으로 한 번에 읽어요">📖 읽기</button>
  <button class="btn mint" id="layoutBtn" title="덩어리들을 읽는 순서대로 가지런히 (AI 안 씀)">✨ 배치</button>
  <button class="btn sky" id="tidyBtn" title="Gemini 가 내용 흐름을 보고 순서·소제목을 정해서 배치">🤖 AI 정리</button>
  <span class="seg" id="mode"><button data-v="inf" class="on" title="아래로 계속 늘어나는 노트">📜 무한</button><button data-v="page" title="한 장씩 넘기는 노트">📄 페이지</button></span>
  <span class="pnav" id="pnav" hidden><button class="btn" id="pPrev">◀</button><b id="pNum">1 / 1</b><button class="btn" id="pNext">▶</button></span>
  <span class="tbR">
    <button class="btn" id="sideT" title="오른쪽 덩어리 목록 보이기/숨기기">📋</button>
    <button class="btn" id="setT" title="위쪽 설정 칸 보이기/숨기기">⚙️</button>
  </span>
</div>

<div class="wrap">
  <div class="paper" id="paper"><svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="gPages"></g><g id="gBoxes"></g><g id="gHeads"></g><g id="gInk"></g><g id="gClean"></g><g id="gLive"></g></g></svg></div>
  <div class="side" id="side"><div class="card empty">아직 덩어리가 없어요. 써 보세요!</div></div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ───────── 상태 ───────── */
const $ = (id) => document.getElementById(id);
const svg = $("board"), NS = "http://www.w3.org/2000/svg";
const KEY = "trickstudy-note-test";
let strokes = [], meta = {}, nextId = 1, tool = "pen", view = "both", color = "#3b2a20", sel = null;
let blocks = [];
let heads = [], mode = "inf", page = 0, pageH = 0, focusUI = false, sideOn = true, noteTitle = ""; // 노트 모드·제목
const undoStack = [];
const env = { api: "none", ko: null, en: null, inputs: new Set() };
let recognizer = null, recLang = null;

function save() { try { localStorage.setItem(KEY, JSON.stringify({ strokes, meta, nextId, topic, check: $("gCheck").checked, auto: $("gAuto").checked, heads, mode, page, pageH, focusUI, sideOn, noteTitle })); } catch (e) { /* 저장 불가 */ } }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d) { strokes = d.strokes || []; meta = d.meta || {}; nextId = d.nextId || 1; topic = d.topic || ""; $("topic").value = topic; $("gCheck").checked = !!d.check; if (d.auto === false) $("gAuto").checked = false; heads = d.heads || []; mode = d.mode || "inf"; page = d.page || 0; pageH = d.pageH || 0; focusUI = !!d.focusUI; sideOn = d.sideOn !== false; noteTitle = d.noteTitle || ""; } } catch (e) { /* 무시 */ }
}
function snapshot() { undoStack.push(JSON.stringify({ strokes, meta, heads })); if (undoStack.length > 60) undoStack.shift(); }
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function say(t) { $("say").textContent = t; if (focusUI) toast(t); }

/* ───────── 손글씨 인식 API 확인 ───────── */
async function query(lang) {
  const n = navigator;
  try {
    if (n.queryHandwritingRecognizer) return await n.queryHandwritingRecognizer({ languages: [lang] });
    if (n.queryHandwritingRecognizerSupport) { const r = await n.queryHandwritingRecognizerSupport({ languages: [lang] }); return r && r.languages ? r : null; }
  } catch (e) { return null; }
  return null;
}
async function checkApi() {
  if (!("createHandwritingRecognizer" in navigator)) env.api = "none";
  else { env.api = "yes"; env.ko = await query("ko"); env.en = await query("en"); }
  // (Gemini 키가 없을 때만 쓰는 예비 인식기라 따로 표시하지 않음)
  if (!gem.key) say("⚙️ 설정의 🔑 AI 인식에 Gemini 키를 넣으면 한국어·수식까지 읽어요.");
}
async function getRecognizer() {
  const lang = env.ko ? "ko" : "en"; // 키가 없을 때만 쓰는 크롬 내장 인식
  if (recognizer && recLang === lang) return recognizer;
  if (env.api !== "yes") return null;
  try { if (recognizer && recognizer.finish) recognizer.finish(); } catch (e) { /* 무시 */ }
  try { recognizer = await navigator.createHandwritingRecognizer({ languages: [lang] }); recLang = lang; }
  catch (e) { recognizer = null; recLang = null; toast("인식기를 못 만들었어요: " + (e.message || e.name)); }
  return recognizer;
}

/* ───────── 그리기 ───────── */
const offY = () => (mode === "page" ? page * pageH : 0);
function pt(e) { const r = svg.getBoundingClientRect(); return { x: +(e.clientX - r.left).toFixed(1), y: +(e.clientY - r.top + offY()).toFixed(1), t: Math.round(e.timeStamp), p: e.pointerType === "pen" ? +(e.pressure || 0.5).toFixed(2) : 0.5 }; }
function pathD(pts) {
  if (!pts.length) return "";
  if (pts.length < 3) return `M${pts[0].x} ${pts[0].y}` + pts.slice(1).map((q) => ` L${q.x} ${q.y}`).join("") + (pts.length === 1 ? ` l0.1 0.1` : "");
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; d += ` Q${a.x} ${a.y} ${((a.x + b.x) / 2).toFixed(1)} ${((a.y + b.y) / 2).toFixed(1)}`; }
  const l = pts[pts.length - 1]; return d + ` L${l.x} ${l.y}`;
}
function widthOf(s) { const ps = s.pts.map((q) => q.p); const avg = ps.reduce((a, b) => a + b, 0) / Math.max(1, ps.length); return +(s.w * (0.55 + avg * 0.9)).toFixed(2); }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

let live = null, liveEl = null, activePointer = null, dragging = null;
svg.addEventListener("pointerdown", (e) => {
  env.inputs.add(e.pointerType);
  if (e.pointerType === "touch" && $("penOnly").checked && env.inputs.has("pen")) { startPan(e); return; } // 손가락 = 스크롤/넘기기 (손바닥으로 그려지지 않음)
  if (activePointer != null) return;
  activePointer = e.pointerId; svg.setPointerCapture(e.pointerId);
  const p = pt(e);
  tapDown = { x: p.x, y: p.y, t: performance.now(), far: 0 };
  const erasing = tool === "erase" || (e.buttons & 32); // 펜 뒤쪽 지우개 버튼
  const hh = (tool === "move" || erasing) && headAt(p); // 소제목: 지우개로 지우고, 옮기기로 끌기
  if (hh && erasing) { snapshot(); heads = heads.filter((x) => x !== hh); render(); save(); dragging = { erase: true }; return; }
  if (hh) { snapshot(); dragging = { head: hh, x: p.x, y: p.y, moved: false }; return; }
  if (erasing) { snapshot(); eraseAt(p); dragging = { erase: true }; return; }
  const sb = (tool === "move" || tool === "lasso") && blocks.find((x) => { if (x.parent) return false; const G = gripPos(x); return Math.abs(p.x - G.x) < 16 && Math.abs(p.y - G.y) < 16; });
  if (sb) { // 손잡이 잡음 → 크기 조절 (세트면 세트 전체)
    sel = sb.key;
    snapshot();
    const group = [sb, ...blocks.filter((x) => x.parent === sb.key)];
    const U = unitBox(sb);
    dragging = { resize: sb, group, ax: U.x, ay: U.y, w0: Math.max(10, U.w), h0: Math.max(10, U.h), k: 1,
      orig: group.flatMap((g) => g.strokes.map((st) => ({ st, w: st.w, pts: st.pts.map((q) => ({ x: q.x, y: q.y })) }))),
      lines: group.map((g) => ({ g, ls: (g.m.lines || []).map((l) => ({ l, box: { ...l.box } })) })) };
    return;
  }
  if (tool === "lasso") { dragging = { lasso: [p] }; $("gLive").innerHTML = ""; dragging.el = el("path", { fill: "rgba(183,124,255,.12)", stroke: "#b77cff", "stroke-width": 2, "stroke-dasharray": "5 4" }, $("gLive")); return; }
  if (tool === "move") {
    const b = blockAt(p);
    if (b) { snapshot(); sel = b.key; const group = [b, ...blocks.filter((x) => x.parent === b.key)]; dragging = { b, group, x: p.x, y: p.y, moved: false }; svg.style.cursor = "grabbing"; render(); }
    else { sel = null; render(); }
    return;
  }
  clearTimeout(recT);
  live = { id: nextId++, pts: [p], w: e.pointerType === "pen" ? 2.6 : 3, c: color };
  liveEl = el("path", { class: "stroke", stroke: color, "stroke-width": live.w }, $("gLive"));
  liveEl.setAttribute("d", pathD(live.pts));
});
svg.addEventListener("pointermove", (e) => {
  if (e.pointerId !== activePointer) return;
  if (tapDown) { const q = pt(e); tapDown.far = Math.max(tapDown.far, Math.hypot(q.x - tapDown.x, q.y - tapDown.y)); }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (dragging && dragging.erase) { evs.forEach((ev) => eraseAt(pt(ev))); return; }

function sectionsFromHeads(order) {
  if (!heads.length) return [{ title: "", items: order }];
  const hs = [...heads].sort((a, c) => a.y - c.y), secs = [{ title: "", items: [] }, ...hs.map((h) => ({ title: h.text, y: h.y, items: [] }))];
  for (const u of order) { let k = 0; for (let i = 0; i < hs.length; i++) if (u.box.y + 4 >= hs[i].y - 30) k = i + 1; secs[k].items.push(u); }
  return secs.filter((sct) => sct.title || sct.items.length);
}

/* ───────── 🤖 AI 정리 (Gemini): 내용 흐름대로 순서 + 소제목 ───────── */
$("tidyBtn").onclick = async () => {
  if (!(gem.key && gem.model)) { toast("🔑 설정에서 Gemini 키를 먼저 넣어 주세요"); if (focusUI) { focusUI = false; applyUI(); } $("aiBox").open = true; return; }
  const us = readingOrder(units());
  if (us.length < 2) return toast("덩어리가 2개 이상일 때 정리할 수 있어요");
  if (busy) return toast("지금 글을 읽는 중이에요. 잠시 뒤에 눌러 주세요");
  const btn = $("tidyBtn"); btn.disabled = true; btn.textContent = "🤖 정리 중…";
  say("에르핀이 Gemini 랑 노트 순서를 고민하는 중… 🤔");
  try {
    const items = us.map((u, i) => {
      const txt = (bl) => (bl.m.lines || []).map((l) => l.text).join(" ");
      const labels = u.group.slice(1).map(txt).filter(Boolean); // 이름표·세트 설명 글
      return { id: i + 1, kind: (u.group.length > 1 && u.group.some((g) => g.m.setp) ? "세트:" : "") + (u.b.type === "text" ? "글" : "그림"), text: u.b.type === "text" ? txt(u.b) || "(아직 안 읽음)" : "", labels, size: [Math.round(u.box.w), Math.round(u.box.h)] };
    });
    const parts = [{ text: `학생의 필기 노트 덩어리 목록이에요${topic ? ` (과목·단원: ${topic})` : ""}. 공부하기 좋게 다시 배치하려고 해요.
- 내용 흐름에 맞게 순서를 정하고, 2~6개의 소단원으로 묶어 짧은 소제목(한국어, 15자 이내)을 붙여 주세요. 덩어리가 적으면 소단원 1~2개도 괜찮아요.
- 그림은 그 그림을 설명하는 글 바로 뒤에 두세요. 그림 이미지는 아래에 id 순서대로 붙였어요.
- 필기 내용은 바꾸거나 빼지 말고, 모든 id 를 정확히 한 번씩 쓰세요.
- 노트 전체 제목도 지어 주세요.
덩어리: ${JSON.stringify(items)}
JSON 만 출력: {"title":"...","sections":[{"title":"...","items":[1,2]}]}` }];
    us.forEach((u, i) => { if (u.b.type !== "text") { parts.push({ text: `그림 id ${i + 1}` }); parts.push({ inline_data: { mime_type: "image/png", data: blockPng(u.b, 384) } }); } });
    const data = await gemCall(parts, SCHEMA_TIDY);
    const used = new Set(), sections = [];
    for (const sc of data.sections || []) {
      const its = (sc.items || []).map((n) => us[(n | 0) - 1]).filter((u) => u && !used.has(u) && used.add(u));
      if (its.length) sections.push({ title: String(sc.title || "").slice(0, 20), items: its });
    }
    const rest = us.filter((u) => !used.has(u)); // 빠뜨린 건 맨 뒤에
    if (rest.length) sections.push({ title: sections.length ? "기타" : "", items: rest });
    snapshot();
    noteTitle = String(data.title || "").slice(0, 30);
    const { plan, newHeads } = planLayout(sections);
    animateTo(plan, newHeads, () => { if (mode === "page") goPage(0); else paper.scrollTo({ top: 0, behavior: "smooth" }); });
    say(`🤖 「${noteTitle || "노트"}」 — 소단원 ${sections.length}개로 정리했어요! 마음에 안 들면 ↶ 되돌리기, 소제목은 ✋ 옮기기로 끌거나 🧽 지우개로 지울 수 있어요.`);
    document.title = (noteTitle ? noteTitle + " · " : "") + "필기 인식 테스트 · 트릭스터디";
  } catch (e) { say("AI 정리 실패: " + e.message); toast("AI 정리 실패: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "🤖 AI 정리"; }
};

/* ───────── 도구 ───────── */
function seg(id, cb) { $(id).querySelectorAll("button").forEach((bt) => (bt.onclick = () => { $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === bt)); cb(bt.dataset.v); })); }
seg("tool", (v) => { tool = v; setTimeout(() => render(true)); svg.classList.toggle("move", v === "move"); svg.classList.toggle("erase", v === "erase"); if (v === "lasso") say("묶고 싶은 획들을 올가미처럼 빙 둘러 감싸 보세요. 감싼 것끼리 한 덩어리가 돼요."); if (v !== "move" && v !== "lasso") { sel = null; render(); } });
seg("view", (v) => { view = v; render(); });
seg("color", (v) => (color = v));
$("gap").oninput = () => { regroup(); };
$("gap").onchange = () => { save(); scheduleRecognize(); };
$("undo").onclick = () => { const s = undoStack.pop(); if (!s) return toast("더 되돌릴 게 없어요"); const d = JSON.parse(s); strokes = d.strokes; meta = d.meta; heads = d.heads || []; regroup(); fitBoard(); save(); scheduleRecognize(); };
$("clear").onclick = () => { if (!strokes.length && !heads.length) return; snapshot(); strokes = []; meta = {}; heads = []; sel = null; regroup(); fitBoard(); save(); toast("다 지웠어요 (되돌리기 가능)"); };
$("copy").onclick = async () => {
  const report = {
    page: "note-test v9", engine: gem.model || "chrome", usedToday: usage().n, mode, pages: pageCount(), heads: heads.map((h) => h.text), noteTitle, ua: navigator.userAgent, api: env.api, ko: !!env.ko, en: !!env.en,
    koInfo: env.ko || null, inputs: [...env.inputs], topic: topic, fixes: fixes.length, ctxCheck: $("gCheck").checked, gap: +$("gap").value,
    blocks: blocks.map((b, i) => ({ n: i + 1, type: b.type, strokes: b.strokes.length, size: [Math.round(b.box.w), Math.round(b.box.h)], ms: b.m.ms, edited: !!b.m.edited, parent: b.parent ? blocks.findIndex((x) => x.key === b.parent) + 1 : null, lines: (b.m.lines || []).map((l) => ({ text: l.text, alts: l.alts })) })),
  };
  const txt = JSON.stringify(report, null, 1);
  try { await navigator.clipboard.writeText(txt); toast("복사했어요! 채팅에 붙여 넣어 주세요"); }
  catch (e) { const w = window.open("", "_blank"); if (w) { w.document.body.innerText = txt; } else toast("복사 실패"); }
};
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("undo").click(); }
  if (mode === "page" && !e.target.closest("input,textarea,[contenteditable]")) { if (e.key === "PageDown" || e.key === "ArrowRight") goPage(page + 1); if (e.key === "PageUp" || e.key === "ArrowLeft") goPage(page - 1); }
});

renderAi(); saveFixes(); showUse(); load(); Object.values(meta).forEach((m) => { if (m.lines && m.lines.some((l) => !l.rel)) { m.lines = null; m.stale = true; } });
$("mode").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.v === mode));
applyUI(); fitPaper(); regroup(); fitBoard(); checkApi().then(() => { blocks.forEach((b) => (b.m.stale = b.m.stale || !b.m.lines)); scheduleRecognize(); });
</script>
