name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 도중 새 푸시가 오면 이전 실행을 끊지 않고 끝날 때까지 기다림
# (중간에 끊으면 GitHub 쪽 Pages 배포가 '진행 중'으로 남아서 다음 배포가 "Deployment failed, try again later" 로 실패했음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      # GitHub 쪽에서 이전 배포가 '진행 중'으로 멈춰 새 배포를 막는 일이 있어서, 최근 커밋들의 배포를 먼저 취소
      - name: 멈춘 이전 배포 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --skip=1 --max-count=4 HEAD); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "취소: $sha" || true
          done
      # 빌드 없는 정적 사이트라 저장소를 그대로 올림
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 올린 직후엔 GitHub 쪽에서 묶음(artifact)이 아직 안 보일 때가 있어서 잠깐 기다림
      - name: 업로드 정리 기다리기
        run: sleep 20
      - id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      # 묶음을 못 찾아 배포가 아예 안 만들어진 경우에만 한 번 더 (이미 만들어진 같은 커밋 배포를 다시 만들면 멈추므로 그땐 새 커밋으로)
      - name: 다시 시도 전 기다리기
        if: steps.try1.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
