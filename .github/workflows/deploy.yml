name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      # GitHub 쪽에서 이전 배포가 '진행 중'으로 멈춰 새 배포를 막는 일이 있어서, 최근 커밋들의 배포를 먼저 취소
      - name: 멈춘 이전 배포 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --skip=1 --max-count=4 HEAD); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "취소: $sha" || true
          done
      # 빌드 없는 정적 사이트라 저장소를 그대로 올림
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 사이트가 커서(약 350MB) Pages 배포가 가끔 '진행 중'에서 멈춤 → 4분 안에 안 끝나면 정리하고 한 번 더
      - id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 240000
      - name: 멈춘 배포 취소
        if: steps.try1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ github.sha }}/cancel" >/dev/null 2>&1 || true
          sleep 20
      - id: deployment
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
