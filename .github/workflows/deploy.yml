name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 도중 새 푸시가 오면 이전 실행을 끊지 않고 끝날 때까지 기다림
# (중간에 끊으면 GitHub 쪽 Pages 배포가 '진행 중'으로 남아서 다음 배포가 "Deployment failed, try again later" 로 실패했음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      # GitHub 쪽에서 이전 배포가 '진행 중'으로 멈춰 새 배포를 막는 일이 있어서, 최근 커밋들의 배포를 먼저 취소
      - name: 멈춘 이전 배포 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --skip=1 --max-count=4 HEAD); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "취소: $sha" || true
          done
      # 빌드 없는 정적 사이트라 저장소를 그대로 올림
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 같은 커밋(SHA)으로 두 번째 배포를 만들면 상태가 비어 있는 채로 멈춰서(재시도는 효과 없음) 한 번만, 넉넉히 기다림
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
